name: Game checks and standalone build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run engine regression tests
        run: node run-tests.js
      - name: Build standalone game
        run: node build-standalone.js
      - name: Upload standalone game
        uses: actions/upload-artifact@v4
        with:
          name: the-failure-files-standalone
          path: the-failure-files-standalone.html
          if-no-files-found: error
